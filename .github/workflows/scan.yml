name: OWASP API Security Scan

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run OWASP Scanner
        run: |
          newman run collections/OWASP-Scanner.postman_collection.json \
          -e environments/crAPI-Local.postman_environment.json \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export reports/owasp-report.html

      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: owasp-scan-report
          path: reports/owasp-report.html